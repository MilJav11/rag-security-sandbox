name: DevSecOps RAG Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Enforce Node.js 24 to fix GitHub Actions deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-fuzzing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run FastAPI Server in Background
      env:
        # Pull the API key from GitHub Secrets
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} 
      run: |
        # Start the server in the background and wait 3 seconds for it to boot
        nohup python app.py &
        sleep 3

    - name: Run Automated Red/Blue Team QA Fuzzer
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        pytest tests/ --html=security_report.html --self-contained-html